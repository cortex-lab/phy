name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # Set up display for GUI testing on Linux
    - name: Set up display (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb herbstluftwm
        export DISPLAY=:99.0
        Xvfb :99 -screen 0 1400x900x24 -ac +extension GLX +render &
        sleep 3
        herbstluftwm &
        sleep 1
      env:
        DISPLAY: :99.0

    - name: Install uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        enable-cache: true
        version: "0.11.31"

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync --frozen --dev --python ${{ matrix.python-version }}

    - name: Lint with ruff
      run: uv run --frozen ruff check phy

    - name: Check formatting with ruff
      run: uv run --frozen ruff format --check phy

    - name: Test with pytest
      run: uv run --no-sync pytest --cov=phy --cov-report=xml phy
      env:
        DISPLAY: ${{ runner.os == 'Linux' && ':99.0' || '' }}
        QT_QPA_PLATFORM: offscreen

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        files: ./coverage.xml
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

  build:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        enable-cache: true
        version: "0.11.31"

    - name: Set up Python
      run: uv python install 3.10

    - name: Build package
      run: uv build --no-sources

    - name: Test wheel installation
      run: |
        uv venv --python 3.10 .venv-package
        uv pip install --python .venv-package/bin/python dist/*.whl
        .venv-package/bin/python -c "import phy; from phy.apps import phycli"

    - name: Upload build artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: dist
        path: dist/
        if-no-files-found: error

  docs:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        enable-cache: true
        version: "0.11.31"

    - name: Set up Python
      run: uv python install 3.10

    - name: Install dependencies
      run: uv sync --frozen --dev --python 3.10

    - name: Generate and validate documentation
      run: make doc-check

  spikeinterface:
    name: SpikeInterface application integration
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        version: "0.11.31"
    - name: Install locked development environment
      run: uv sync --frozen --dev --python 3.12
    - name: Install reviewed phylib and SpikeInterface
      run: >-
        uv pip install --python .venv
        "phylib[spikeinterface] @ git+https://github.com/cortex-lab/phylib.git@ded47ba902b4470405138e8af7febd8d02094b1b"
        "spikeinterface==0.105.3" "zarr<3"
    - name: Check required integration capabilities
      run: >-
        uv run --no-sync python -c
        "import spikeinterface, zarr; from phylib.io.traces import SpikeInterfaceEphysReader"
    - name: Set up display
      run: sudo apt-get update && sudo apt-get install -y xvfb
    - name: Test application integration
      run: >-
        xvfb-run -a uv run --no-sync pytest --no-cov
        phy/apps/tests/test_spikeinterface.py phy/apps/trace/tests/test_gui.py
      env:
        QT_QPA_PLATFORM: offscreen
        LIBGL_ALWAYS_SOFTWARE: "1"
